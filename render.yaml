# Free demo hosting. Setup: docs/free-hosting.md
# Supply the Neon connection values in Render; keep credentials out of Git.
services:
  - type: web
    name: byte-ring-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    healthCheckPath: /health
    # Use the Dockerfile CMD: start.sh initializes the database and runs Gunicorn.
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_PORT
        value: "5432"
      - key: PGSSLMODE
        value: require
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
