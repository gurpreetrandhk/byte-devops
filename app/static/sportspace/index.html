<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>dhoyo | Your people. Your game.</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="social.css">
  <link rel="stylesheet" href="arena.css">
  <link rel="stylesheet" href="ring.css">
  <link rel="stylesheet" href="network.css">
  <link rel="stylesheet" href="profile.css">
  <script src="app.js" defer></script>
  <script src="social.js" defer></script>
  <script src="arena.js" defer></script>
  <script src="ring.js" defer></script>
  <script src="network.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#ring"><span class="brand-mark">D</span> dhoyo<span class="ring-wordmark-dot">.</span></a>
    <div class="workspace-label">YOUR SPORTING UNIVERSE</div>
    <nav aria-label="Main navigation">
      <button data-ring-route="ring"><img class="nav-icon" src="icons/house.svg" alt=""> Your dhoyo</button>
      <button data-ring-route="discover"><img class="nav-icon" src="icons/compass.svg" alt=""> Discover Arenas</button>
      <button data-ring-route="player/demo-user"><img class="nav-icon" src="icons/user.svg" alt=""> My profile</button>
      <button data-view="grounds"><img class="nav-icon" src="icons/map-pin.svg" alt=""> Book a ground</button>
      <button data-view="tournaments"><img class="nav-icon" src="icons/trophy.svg" alt=""> Tournaments</button>
      <button data-view="activity"><img class="nav-icon" src="icons/bookmark.svg" alt=""> Saved & activity</button>
    </nav>
    <div id="ring-memberships"></div>
    <div class="sidebar-bottom"><span class="avatar mine">JD</span><div><strong>Jordan Davis</strong><small>Player account · Demo</small></div></div>
  </aside>
  <div class="shell">
    <header class="topbar"><span class="top-title">THE NEXT GENERATION OF PLAY</span><label class="search"><img class="nav-icon" src="icons/search.svg" alt=""><input id="search" type="search" placeholder="Search your dhoyo" aria-label="Search current view"></label><a href="#player/demo-user" class="avatar mine small" aria-label="My player profile">JD</a></header>
    <main>
      <div class="page-heading"><div><p class="eyebrow" id="eyebrow">THE COMMUNITY</p><h1 id="title">A shared love of the game.</h1><p id="subtitle">On the field. On the server. In good company.</p></div><button class="primary" id="create">+ Create post</button></div>
      <div class="filters" id="filters" role="group" aria-label="Filter by sport"></div>
      <div id="content"></div>
    </main>
    <footer>dhoyo / MADE FOR THE GAME <span id="connection-status">Demo account</span></footer>
  </div>
  <dialog id="modal"><form id="modal-form"><div class="modal-heading"><h2 id="modal-title"></h2><button type="button" class="icon-button" id="close-modal" aria-label="Close dialog" title="Close">×</button></div><div id="modal-body"></div><button class="primary wide" id="submit-modal" type="submit">Save</button></form></dialog>
  <div id="toast" role="status"></div>
  <dialog id="story-dialog" aria-label="Story viewer"><div id="story-content"></div></dialog>
</body>
</html>
